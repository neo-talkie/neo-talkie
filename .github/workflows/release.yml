name: Release APKs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional short release notes shown in GitHub Release
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: neotalkie-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing Android release signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (and optionally ANDROID_KEY_PASSWORD) in repository Settings -> Secrets -> Actions. See docs/ota.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Prepare SDK and dependencies
        run: |
          sdkmanager 'platforms;android-28' 'build-tools;35.0.0' 'platform-tools'
          make setup
          python3 android/scripts/setup.py

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APKs
        env:
          NEOTALKIE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          NEOTALKIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEOTALKIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEOTALKIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEOTALKIE_RELEASE_BUILD: ${{ github.run_number }}
        run: python3 android/scripts/build.py all

      - name: Run offline verification
        run: make test

      - name: Generate OTA manifest and tag
        id: meta
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          BASE_VERSION=$(python3 -c "import re, pathlib; m=re.search(r'android:versionName=\"([^\"]+)\"', pathlib.Path('android/launcher/AndroidManifest.xml').read_text()); print(m.group(1))")
          TAG="v${BASE_VERSION}-build.${RUN_NUMBER}"
          NOTES="${CUSTOM_NOTES:-Main branch release ${TAG} (${COMMIT_SHA:0:7})}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          python3 android/scripts/release_manifest.py \
            --tag "$TAG" \
            --version "${BASE_VERSION}+${RUN_NUMBER}" \
            --repo "$REPO" \
            --notes "$NOTES" \
            --output "$RUNNER_TEMP/release-assets/ota-manifest.json"
          cp android/*/build/neotalkie-*.apk "$RUNNER_TEMP/release-assets/"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}+${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/release-assets/"* \
            --target "${{ github.sha }}" \
            --title "NeoTalkie ${VERSION}" \
            --notes "${NOTES}" \
            --latest

      - name: Sync OTA release to Aliyun OSS
        env:
          AK_ID: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_ID }}
          AK_SECRET: ${{ secrets.ALIYUN_OSS_ACCESS_KEY_SECRET }}
          BUCKET: ${{ secrets.ALIYUN_OSS_BUCKET }}
          ENDPOINT: ${{ secrets.ALIYUN_OSS_ENDPOINT }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$AK_ID" ] || [ -z "$AK_SECRET" ] || [ -z "$BUCKET" ] || [ -z "$ENDPOINT" ]; then
            echo "Aliyun OSS secrets not configured; skipping OSS sync."
            exit 0
          fi
          OSS_BASE="https://${BUCKET}.${ENDPOINT}/ota/${TAG}"
          python3 android/scripts/release_manifest.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --repo "$REPO" \
            --url-base "$OSS_BASE" \
            --notes "$NOTES" \
            --output "$RUNNER_TEMP/oss-manifest.json"
          python3 - <<'PY'
          import base64, datetime, hashlib, hmac, os, pathlib, urllib.request

          ak_id = os.environ['AK_ID']
          ak_secret = os.environ['AK_SECRET'].encode('utf-8')
          bucket = os.environ['BUCKET']
          endpoint = os.environ['ENDPOINT']
          tag = os.environ['TAG']
          temp = pathlib.Path(os.environ['RUNNER_TEMP'])

          def put_object(key, data, content_type, cache_control=''):
              date = datetime.datetime.now(datetime.timezone.utc).strftime('%a, %d %b %Y %H:%M:%S GMT')
              md5 = base64.b64encode(hashlib.md5(data).digest()).decode()
              canonical = f"PUT\n{md5}\n{content_type}\n{date}\n/{bucket}/{key}"
              sig = base64.b64encode(hmac.new(ak_secret, canonical.encode('utf-8'), hashlib.sha1).digest()).decode()
              headers = {
                  'Date': date,
                  'Content-MD5': md5,
                  'Content-Type': content_type,
                  'Authorization': f'OSS {ak_id}:{sig}',
              }
              if cache_control:
                  headers['Cache-Control'] = cache_control
              req = urllib.request.Request(f"https://{bucket}.{endpoint}/{key}", data=data, headers=headers, method='PUT')
              with urllib.request.urlopen(req, timeout=60) as resp:
                  print(f"Uploaded {key}: HTTP {resp.status} ({len(data)} bytes)")

          for apk in sorted((temp / 'release-assets').glob('neotalkie-*.apk')):
              put_object(f"ota/{tag}/{apk.name}", apk.read_bytes(), 'application/vnd.android.package-archive')
          manifest_bytes = (temp / 'oss-manifest.json').read_bytes()
          put_object(f"ota/{tag}/ota-manifest.json", manifest_bytes, 'application/json; charset=utf-8')
          put_object("ota/latest/ota-manifest.json", manifest_bytes, 'application/json; charset=utf-8', cache_control='no-cache')
          PY

      - name: Clean up release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

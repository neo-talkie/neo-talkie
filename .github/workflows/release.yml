name: Release APKs

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_notes:
        description: Optional short release notes shown in GitHub Release
        required: false
        default: ""

permissions:
  contents: write

concurrency:
  group: neotalkie-release-main
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check signing secret
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ]; then
            echo "::error::Missing Android release signing secrets. Configure ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS (and optionally ANDROID_KEY_PASSWORD) in repository Settings -> Secrets -> Actions. See docs/ota.md."
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Android SDK tools
        run: |
          SDK_ROOT="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -maxdepth 3 -name sdkmanager -type f 2>/dev/null | head -n 1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "::error::sdkmanager not found under $SDK_ROOT/cmdline-tools"
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          yes | "$SDKMANAGER" --licenses >/dev/null || true

      - name: Prepare SDK and dependencies
        run: |
          sdkmanager 'platforms;android-28' 'build-tools;35.0.0' 'platform-tools'
          make setup
          python3 android/scripts/setup.py

      - name: Decode release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.keystore"
          chmod 600 "$RUNNER_TEMP/release.keystore"

      - name: Build signed release APKs
        env:
          NEOTALKIE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          NEOTALKIE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEOTALKIE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          NEOTALKIE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD || secrets.ANDROID_KEYSTORE_PASSWORD }}
          NEOTALKIE_RELEASE_BUILD: ${{ github.run_number }}
        run: python3 android/scripts/build.py all

      - name: Run offline verification
        run: make test

      - name: Generate OTA manifest and tag
        id: meta
        env:
          RUN_NUMBER: ${{ github.run_number }}
          REPO: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          CUSTOM_NOTES: ${{ github.event.inputs.release_notes }}
        run: |
          BASE_VERSION=$(python3 -c "import re, pathlib; m=re.search(r'android:versionName=\"([^\"]+)\"', pathlib.Path('android/launcher/AndroidManifest.xml').read_text()); print(m.group(1))")
          TAG="v${BASE_VERSION}-build.${RUN_NUMBER}"
          NOTES="${CUSTOM_NOTES:-Main branch release ${TAG} (${COMMIT_SHA:0:7})}"
          mkdir -p "$RUNNER_TEMP/release-assets"
          python3 android/scripts/release_manifest.py \
            --tag "$TAG" \
            --version "${BASE_VERSION}+${RUN_NUMBER}" \
            --repo "$REPO" \
            --notes "$NOTES" \
            --output "$RUNNER_TEMP/release-assets/ota-manifest.json"
          cp android/*/build/neotalkie-*.apk "$RUNNER_TEMP/release-assets/"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${BASE_VERSION}+${RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          echo "notes=$NOTES" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
        run: |
          gh release create "$TAG" \
            "$RUNNER_TEMP/release-assets/"* \
            --target "${{ github.sha }}" \
            --title "NeoTalkie ${VERSION}" \
            --notes "${NOTES}" \
            --latest

      - name: Deploy OTA release to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TAG: ${{ steps.meta.outputs.tag }}
          VERSION: ${{ steps.meta.outputs.version }}
          NOTES: ${{ steps.meta.outputs.notes }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "Cloudflare Pages secrets not configured; skipping Pages deploy."
            exit 0
          fi
          STAGE="$RUNNER_TEMP/cf-pages"
          rm -rf "$STAGE"
          mkdir -p "$STAGE/ota/latest" "$STAGE/ota/${TAG}"
          cp "$RUNNER_TEMP/release-assets/"neotalkie-*.apk "$STAGE/ota/${TAG}/"
          python3 android/scripts/release_manifest.py \
            --tag "$TAG" \
            --version "$VERSION" \
            --repo "$REPO" \
            --url-base "https://neotalkie-ota.pages.dev/ota/${TAG}" \
            --notes "$NOTES" \
            --output "$STAGE/ota/${TAG}/ota-manifest.json"
          cp "$STAGE/ota/${TAG}/ota-manifest.json" "$STAGE/ota/latest/ota-manifest.json"
          cat > "$STAGE/_headers" <<'EOF'
          /ota/latest/*
            Cache-Control: no-cache, must-revalidate
          EOF
          npx --yes wrangler@4 pages deploy "$STAGE" --project-name neotalkie-ota --branch main --commit-dirty=true

      - name: Clean up release keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

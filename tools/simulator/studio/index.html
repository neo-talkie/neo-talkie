<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>手台设计工作台 · NeoTalkie</title><link rel="icon" href="/assets/favicon.svg"><link rel="stylesheet" href="/studio/studio.css"></head>
<body>
<header class="mast"><div class="brand"><span class="wave" aria-hidden="true"><i></i><i></i><i></i><i></i></span>NeoTalkie <span class="brand-sub">Design Studio</span></div><a href="/lab">打开模拟器 ↗</a></header>
<div class="shell">
<main>
<div class="page-head"><div><h1 id="app-name">手台设计工作台</h1><p id="package">全部应用 · 瀑布流总览</p></div><span id="count"></span></div>
<div class="toolbar"><nav id="apps" aria-label="应用跳转"></nav><div class="filters"><input type="search" id="search" placeholder="查找场景：名称、状态或场景 ID" aria-label="查找场景"><label class="toggle"><input type="checkbox" id="captured">仅看已有实图</label></div></div>
<section id="detail" aria-labelledby="scene-name"><div class="detail-head"><div><p id="location"></p><h2 id="scene-name"></h2></div><code id="scene-id"></code></div>
<div class="pair">
<figure><figcaption><strong>设计基准</strong><span>160 × 128</span></figcaption><div class="screen"><img id="reference" alt="设计参考图"></div></figure>
<figure><figcaption><strong>Android 实图</strong><span id="actual-tag"></span></figcaption><div class="screen actual"><img id="actual" alt="Android 实际渲染图" hidden><div id="pending"><span class="empty-icon" aria-hidden="true">▧</span>待采集</div></div></figure>
</div><p id="scene-note"></p><p id="provenance" hidden></p><p id="stale" role="status" hidden></p>
<div class="actions"><button id="import">导入实图</button><button id="compare" hidden>叠加比对</button><button id="inputs" aria-expanded="false">查看场景参数</button></div>
<div id="overlay" hidden><label>实图透明度 <input id="opacity" type="range" min="0" max="100" value="50"></label><div class="layers"><img id="layer-ref" alt="基准底图"><img id="layer-actual" alt="实际画面叠层"></div></div>
<pre id="parameters" hidden></pre></section>
<section class="inventory"><div id="list"></div></section><p id="error" role="alert"></p></main></div>
<dialog id="dialog"><form id="form"><h2>导入 Android 实图</h2><p id="import-for"></p><label>截图文件<input name="file" type="file" accept="image/png" required></label>
<label>应用版本<input name="version" maxlength="80" placeholder="例如 0.8" required></label><label>采集来源<input name="source" maxlength="120" placeholder="例如 mx_b5 真机或 Android 模拟器" required></label>
<label>方向<select name="rotation"><option value="0">横向 160 × 128</option><option value="left">竖向截图，向左转 90°</option><option value="right">竖向截图，向右转 90°</option></select></label>
<p>请核对页面、焦点和状态。截图保存在当前浏览器。</p><p id="form-error" role="alert"></p><div class="actions"><button type="submit">保存实图</button><button type="button" id="cancel">取消</button></div></form></dialog>
<script type="module" src="/studio/studio.js"></script></body></html>
